site:
  name: 'Curious Science'
  site: 'https://curiousscience.curiolot.com'
  base: '/'
  trailingSlash: false

  # Kosongkan atau isi nanti jika sudah mendaftarkan ke Google Search Console
  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: 'Curious Science — Frontiers of Physics, Cosmos & Mind'
    template: '%s — Curious Science'
  description: 'Explorations into the deepest questions of modern cosmology, quantum physics, extreme biology, and unexplained scientific phenomena.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 'Curious Science'
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Struktur URL artikel bersih (contoh: curious-science.pages.dev/dark-matter-mystery)
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Halaman indeks seluruh artikel
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Contoh: /category/cosmos
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # Masukkan ID Google Analytics (G-XXXXXXXXXX) jika nanti sudah dibuat

ui:
  theme: 'system' # Otomatis mengikuti tema perangkat pembaca (Dark/Light mode)
